name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1-5"

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic tests
        run: python -m pytest -m "not live_api and not live_scraping"

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy .

  live-smoke:
    name: Opt-in live smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    env:
      NLP_STOCK_PREDICTION_ALLOW_LIVE_TESTS: "1"
      NLP_STOCK_PREDICTION_LIVE_USER_AGENT: ${{ secrets.NLP_STOCK_PREDICTION_LIVE_USER_AGENT }}
      NLP_STOCK_PREDICTION_LIVE_SCRAPE_URL: ${{ secrets.NLP_STOCK_PREDICTION_LIVE_SCRAPE_URL }}
      NLP_STOCK_PREDICTION_LIVE_SCRAPE_EXPECT_TEXT: ${{ secrets.NLP_STOCK_PREDICTION_LIVE_SCRAPE_EXPECT_TEXT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Live API smoke checks
        run: python -m pytest -m live_api

      - name: Live scraping smoke checks
        run: python -m pytest -m live_scraping
