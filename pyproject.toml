[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nlp-stock-prediction"
version = "0.1.0"
description = "Codex-led CLI for evidence-backed market prediction research reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
timesfm-raw = [
  "accelerate>=1.13,<2",
  "huggingface_hub>=1.14,<2",
  "pandas>=3.0,<4",
  "pyarrow>=24,<25",
  "safetensors>=0.7,<1",
  "torch>=2.11,<3",
  "transformers>=5.8,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_stock_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
  "unit: Pure logic and small modules.",
  "schema: Pydantic models and serialization.",
  "contract: Provider adapters using recorded fixtures.",
  "integration: Multi-module behavior with controlled dependencies.",
  "live_api: Real API calls requiring credentials or internet access.",
  "live_scraping: Real public HTML scraping checks.",
  "llm: LLM extraction and schema validation.",
  "e2e: Full CLI report generation.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
